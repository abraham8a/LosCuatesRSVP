<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Host Dashboard · RSVP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <!-- Password gate (shown until authenticated) -->
  <div class="pw-gate" id="pw-gate">
    <div class="pw-card">
      <span class="lock-icon">🔒</span>
      <h2>Host access</h2>
      <p>Enter the host password to view the dashboard.</p>
      <div class="field-group" style="text-align:left">
        <label for="pw-input">Password</label>
        <input type="password" id="pw-input" placeholder="Enter password" autocomplete="current-password" />
        <span class="pw-error" id="pw-error"></span>
      </div>
      <button class="btn-submit" id="pw-submit">
        Unlock dashboard
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>

  <!-- Dashboard (hidden until authenticated) -->
  <main class="container wide hidden" id="dashboard">

    <header class="event-header" style="text-align:left; margin-bottom:2rem;">
      <a href="index.html" class="back-link">← Guest view</a>
      <h1 style="font-family:'DM Serif Display',serif; font-weight:400; font-size:clamp(1.8rem,4vw,2.5rem); margin-bottom:0.25rem;">Host dashboard</h1>
      <span class="eyebrow" id="admin-event-title">Graduation Celebration</span>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Attending</span>
        <span class="stat-value green" id="stat-attending">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Total guests</span>
        <span class="stat-value" id="stat-total-guests">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Declined</span>
        <span class="stat-value red" id="stat-declined">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Cancelled</span>
        <span class="stat-value muted" id="stat-cancelled">0</span>
      </div>
    </div>

    <div class="search-bar-wrap">
      <input type="text" id="guest-search" placeholder="Search by name or email…" style="width:100%;margin-bottom:0.75rem;" />
    </div>
    <div class="admin-toolbar">
      <div class="filter-tabs">
        <button class="tab active" data-filter="all">All</button>
        <button class="tab" data-filter="attending">Attending</button>
        <button class="tab" data-filter="declined">Declined</button>
        <button class="tab" data-filter="cancelled">Cancelled</button>
      </div>
      <div class="toolbar-right">
        <button class="btn-ghost small" id="export-btn">Export CSV</button>
        <button class="btn-ghost small" id="lock-btn">Lock</button>
        <button class="btn-ghost small danger" id="clear-btn">Clear all</button>
      </div>
    </div>

    <div class="guest-table-wrap">
      <table class="guest-table" id="guest-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>+Guests</th>
            <th>Dietary</th>
            <th>Message</th>
            <th>Status</th>
            <th>Submitted</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="guest-tbody"></tbody>
      </table>
      <div class="empty-state hidden" id="empty-state">
        <p>No RSVPs yet. Share the link and watch this fill up!</p>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
  <script src="admin.js"></script>
</body>
</html>
