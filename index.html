<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thank You</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #1a0f2e 0%, #0a0512 60%, #000 100%);
    overflow: hidden;
    font-family: 'Georgia', 'Times New Roman', serif;
    position: relative;
  }

  /* Floating sparkles */
  .sparkle {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 6px 2px rgba(255,255,255,0.8);
    animation: float 6s ease-in-out infinite, twinkle 2s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) translateX(0); }
    50% { transform: translateY(-30px) translateX(15px); }
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  .card {
    position: relative;
    text-align: center;
    padding: 60px 70px;
    z-index: 2;
  }

  h1 {
    font-size: 3.2rem;
    font-weight: 400;
    letter-spacing: 2px;
    background: linear-gradient(90deg,
      #ffd89b, #ffffff, #ffd89b, #f9c5d1, #ffffff, #ffd89b);
    background-size: 400% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 4s linear infinite;
    text-shadow: 0 0 40px rgba(255, 216, 155, 0.3);
    margin-bottom: 20px;
  }

  @keyframes shimmer {
    0% { background-position: 0% center; }
    100% { background-position: 400% center; }
  }

  p {
    font-size: 1.25rem;
    color: rgba(255, 255, 255, 0.75);
    letter-spacing: 1px;
    animation: glowPulse 3s ease-in-out infinite;
    max-width: 500px;
    margin: 0 auto;
    line-height: 1.6;
  }

  @keyframes glowPulse {
    0%, 100% { text-shadow: 0 0 8px rgba(255,255,255,0.15); }
    50% { text-shadow: 0 0 20px rgba(255,255,255,0.5); }
  }

  .divider {
    width: 80px;
    height: 1px;
    margin: 24px auto;
    background: linear-gradient(90deg, transparent, #ffd89b, transparent);
    animation: glowPulse 3s ease-in-out infinite;
  }

  /* Soft glowing aura behind the card */
  .glow-aura {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 500px;
    height: 500px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,216,155,0.15) 0%, transparent 70%);
    filter: blur(20px);
    animation: auraPulse 4s ease-in-out infinite;
    z-index: 1;
  }

  @keyframes auraPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
    50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
  }
</style>
</head>
<body>

  <div class="glow-aura"></div>
  <div class="card">
    <h1>Thank You</h1>
    <div class="divider"></div>
    <p>For sharing a wonderful time with us.<br>It meant more than words can say.</p>
  </div>

<script>
  // Generate random floating sparkles
  const body = document.body;
  const sparkleCount = 40;
  for (let i = 0; i < sparkleCount; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDelay = (Math.random() * 6) + 's, ' + (Math.random() * 2) + 's';
    s.style.animationDuration = (4 + Math.random() * 4) + 's, ' + (1.5 + Math.random() * 2) + 's';
    body.appendChild(s);
  }
</script>

</body>
</html>
